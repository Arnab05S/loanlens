{
  "name": "Deploy backend to Render",
    "on": { "push": { "branches": ["fix/real-analysis"], "paths": ["backend/**", ".github/workflows/deploy-render-backend.yml"] } },
      "jobs": { "deploy": { "runs-on": "ubuntu-latest", "steps": [ { "name": "Trigger Render deployment", "env": { "RENDER_DEPLOY_HOOK": "${{ secrets.RENDER_DEPLOY_HOOK }}" }, "shell": "bash", "run": "test -n \"$RENDER_DEPLOY_HOOK\" && curl --fail --silent --show-error --request POST --output /dev/null --write-out \"Render deploy hook response: HTTP %{http_code}\" \"$RENDER_DEPLOY_HOOK\"" } ] } }
      }
      
