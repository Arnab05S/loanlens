{"name":"LoanLens backend validation","on":{"pull_request":{"branches":["main"],"paths":["backend/**",".github/workflows/deploy-render-backend.yml","index.html","frontend/index.html","README.md"]},"push":{"branches":["fix/real-analysis"],"paths":["backend/**",".github/workflows/deploy-render-backend.yml"]},"workflow_dispatch":{}},"permissions":{"contents":"read"},"concurrency":{"group":"loanlens-backend-${{ github.ref }}","cancel-in-progress":true},"jobs":{"test":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"name":"Check out exact PR head or pushed commit","uses":"actions/checkout@v4","with":{"ref":"${{ github.event.pull_request.head.sha || github.sha }}"}},{"name":"Set up Python","uses":"actions/setup-python@v5","with":{"python-version":"3.12","cache":"pip","cache-dependency-path":"backend/requirements.txt"}},{"name":"Install backend dependencies","run":"python -m pip install --disable-pip-version-check -r requirements.txt","working-directory":"backend"},{"name":"Run backend and upload-format tests","run":"python -m unittest discover -v","working-directory":"backend"},{"name":"Validate mirrored frontend scripts","shell":"bash","run":"from pathlib import Path\nimport re\nimport subprocess\nimport tempfile\n\nroot = Path('index.html').read_text(encoding='utf-8')\nmirror = Path('frontend/index.html').read_text(encoding='utf-8')\nif root != mirror:\n    raise SystemExit('index.html and frontend/index.html must remain byte-identical')\nif 'review_priority_score' not in root or 'function escapeHTML' not in root:\n    raise SystemExit('The Review Priority renderer or HTML escaping helper is missing')\nscripts = re.findall(r'<script\\b[^>]*>(.*?)</script>', root, flags=re.IGNORECASE | re.DOTALL)\nif not scripts:\n    raise SystemExit('No inline scripts found to validate')\nwith tempfile.TemporaryDirectory() as temp:\n    for index, source in enumerate(scripts):\n        path = Path(temp) / f'inline-{index}.js'\n        path.write_text(source, encoding='utf-8')\n        subprocess.run(['node', '--check', str(path)], check=True)\nprint(f'Frontend mirrors match; checked {len(scripts)} inline script(s).')"}]},"container-smoke":{"needs":"test","runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"name":"Check out exact PR head or pushed commit","uses":"actions/checkout@v4","with":{"ref":"${{ github.event.pull_request.head.sha || github.sha }}"}},{"name":"Build backend container","run":"docker build --file backend/Dockerfile --tag loanlens-api:ci backend"},{"name":"Start container and verify health endpoint","shell":"bash","run":"set -euo pipefail\ncontainer_id=\"$(docker run -d -p 127.0.0.1:18080:8080 loanlens-api:ci)\"\ncleanup() {\n  docker logs \"$container_id\" || true\n  docker rm -f \"$container_id\" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\nfor attempt in {1..30}; do\n  if body=\"$(curl --fail --silent http://127.0.0.1:18080/health 2>/dev/null)\"; then\n    printf '%s\\n' \"$body\"\n    if [[ \"$body\" == *'\"status\":\"ok\"'* ]]; then\n      exit 0\n    fi\n  fi\n  sleep 2\ndone\necho 'Backend container did not become healthy in 60 seconds.' >&2\nexit 1"}]}}}
