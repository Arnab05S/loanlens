name: LoanLens backend validation

on:
  pull_request:
      branches:
            - main
                paths:
                      - 'backend/**'
                            - '.github/workflows/deploy-render-backend.yml'
                                  - 'index.html'
                                        - 'frontend/index.html'
                                              - 'README.md'
                                                push:
                                                    branches:
                                                          - fix/real-analysis
                                                              paths:
                                                                    - 'backend/**'
                                                                          - '.github/workflows/deploy-render-backend.yml'
                                                                            workflow_dispatch:

                                                                            permissions:
                                                                              contents: read

                                                                              concurrency:
                                                                                group: loanlens-backend-${{ github.ref }}
                                                                                  cancel-in-progress: true

                                                                                  jobs:
                                                                                    test:
                                                                                        runs-on: ubuntu-latest
                                                                                            timeout-minutes: 15
                                                                                                steps:
                                                                                                      - name: Check out exact PR head or pushed commit
                                                                                                              uses: actions/checkout@v4
                                                                                                                      with:
                                                                                                                                ref: ${{ github.event.pull_request.head.sha || github.sha }}
                                                                                                                                      - name: Set up Python
                                                                                                                                              uses: actions/setup-python@v5
                                                                                                                                                      with:
                                                                                                                                                                python-version: '3.12'
                                                                                                                                                                          cache: pip
                                                                                                                                                                                    cache-dependency-path: backend/requirements.txt
                                                                                                                                                                                          - name: Install backend dependencies
                                                                                                                                                                                                  run: python -m pip install --disable-pip-version-check -r requirements.txt
                                                                                                                                                                                                          working-directory: backend
                                                                                                                                                                                                                - name: Run backend and upload-format tests
                                                                                                                                                                                                                        run: python -m unittest discover -v
                                                                                                                                                                                                                                working-directory: backend
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                  container-smoke:
                                                                                                                                                                                                                                      needs: test
                                                                                                                                                                                                                                          runs-on: ubuntu-latest
                                                                                                                                                                                                                                              timeout-minutes: 15
                                                                                                                                                                                                                                                  steps:
                                                                                                                                                                                                                                                        - name: Check out exact PR head or pushed commit
                                                                                                                                                                                                                                                                uses: actions/checkout@v4
                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                                                                                                                                                                                                                                                                                        - name: Build backend container
                                                                                                                                                                                                                                                                                                run: docker build --file backend/Dockerfile --tag loanlens-api:ci backend
                                                                                                                                                                                                                                                                                                      - name: Start container and verify health endpoint
                                                                                                                                                                                                                                                                                                              shell: bash
                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                set -euo pipefail
                                                                                                                                                                                                                                                                                                                                          container_id="$(docker run -d -p 127.0.0.1:18080:8080 loanlens-api:ci)"
                                                                                                                                                                                                                                                                                                                                                    cleanup() {
                                                                                                                                                                                                                                                                                                                                                                docker logs "$container_id" || true
                                                                                                                                                                                                                                                                                                                                                                            docker rm -f "$container_id" >/dev/null 2>&1 || true
                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                trap cleanup EXIT
                                                                                                                                                                                                                                                                                                                                                                                                          for attempt in {1..30}; do
                                                                                                                                                                                                                                                                                                                                                                                                                      if body="$(curl --fail --silent http://127.0.0.1:18080/health 2>/dev/null)"; then
                                                                                                                                                                                                                                                                                                                                                                                                                                    printf '%s\n' "$body"
                                                                                                                                                                                                                                                                                                                                                                                                                                                  if [[ "$body" == *'"status":"ok"'* ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  exit 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        sleep 2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo 'Backend container did not become healthy in 60 seconds.' >&2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      exit 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
